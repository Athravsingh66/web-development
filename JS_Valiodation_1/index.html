<!DOCTYPE html>
<html>
<head>

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h2 align="center">NAME AND PASSWORD VALIDATION</h2>

        </form>

    <script src="script.js"></script>
</body>
</html>
