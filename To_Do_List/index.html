<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do-List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="outer-frame">
        <div class="inner-frame">

            <h1 class="title">MY-To-Do-List</h1>
            <div class="subtitle">Add New Task</div>
            <div class="input-row">
                <input type="text" id="addtask" placeholder="Enter your task">
                <button id="addbutton" class="bt add">Add Task</button>
            </div>

            <div class="action-row">
                <button id="delcom" class="del Complete">Delete All Completed Task</button>
                <button id="clearbt" class="btn clear">Clear All Task</button>
            </div>

            <div class="list-container">
                <ul id="tasklist" class="task-list"></ul>
            </div>

        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
