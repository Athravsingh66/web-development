<!DOCTYPE html>
<html>
<head>
    <title>Registration Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h2>Registration Form</h2>

    <form onsubmit="return validateForm()">
        <table class="registration_form">
            <tr>
                <td>Full Name:</td>
                <td>
                    <input type="text" id="name" name="name" placeholder="Enter your name">
                </td>
            </tr>

            <tr>
                <td>Email:</td>
                <td>
                    <input type="text" id="email" name="email" placeholder="Enter Your Email">
                </td>
            </tr>

            <tr>
                <td>Phone Number:</td>
                <td>
                    <input type="number" id="phone" name="phone" placeholder="Enter your Phone Number">
                </td>
            </tr>

            <tr>
                <td>Gender:</td>
                <td>
                    <input type="radio" name="gender" value="Male"> Male
                    <input type="radio" name="gender" value="Female"> Female
                </td>
            </tr>

            <tr>
                <td>Date Of Birth:</td>
                <td>
                    <input type="date" id="dob" name="dob">
                </td>    
            </tr>

            <tr>
                <td>Languages You Know:</td>
                <td>
                    <input type="checkbox" name="languages" value="English"> English <br>
                    <input type="checkbox" name="languages" value="Hindi"> Hindi <br>
                    <input type="checkbox" name="languages" value="Tamil"> Tamil <br>
                    <input type="checkbox" name="languages" value="Telgue"> Telgue <br>
                </td>
            </tr>

            <tr>
                <td>Address:</td>
                <td>
                    <textarea id="address" name="address" rows="5" cols="35" placeholder="Enter your Address"></textarea>
                </td>
            </tr>

             <tr>
                <td colspan="2">
                    <input type="submit" value="Register">
                    <input type="reset" value="Reset">
                </td>
            </tr>
        </table>
    </form>

    <p id="msg"></p>
    
    <script src="script.js"></script>

</body>
</html>
